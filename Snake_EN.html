<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial;
    text-align: center;
}
h1 { margin: 20px 0 5px; }
#score { font-size: 20px; margin: 10px; }
canvas {
    background: #1f2937;
    border: 4px solid #4b5563;
    border-radius: 10px;
}
button {
    display: block;
    margin: 15px auto;
    padding: 10px 25px;
    font-size: 18px;
    background: #22c55e;
    color: white;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🐍 2D Snake Game</h1>
<div id="score">Score: 0</div>

<canvas id="game" width="500" height="500"></canvas>

<button onclick="startGame()">Restart</button>

<p>Use Arrow Keys / WASD to control</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;
const tiles = canvas.width / size;

let snake;
let food;
let dx;
let dy;
let nextDx;
let nextDy;
let score;
let timer;
let dead;

function startGame() {
    clearTimeout(timer);

    snake = [
        {x: 12, y: 12},
        {x: 11, y: 12},
        {x: 10, y: 12}
    ];

    dx = 1;
    dy = 0;
    nextDx = 1;
    nextDy = 0;

    score = 0;
    dead = false;

    document.getElementById("score").textContent = "Score: 0";

    makeFood();
    gameLoop();
}

function makeFood() {
    do {
        food = {
            x: Math.floor(Math.random() * tiles),
            y: Math.floor(Math.random() * tiles)
        };
    } while (
        snake.some(part =>
            part.x === food.x &&
            part.y === food.y
        )
    );
}

function gameLoop() {
    if (dead) return;

    dx = nextDx;
    dy = nextDy;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    if (
        head.x < 0 ||
        head.x >= tiles ||
        head.y < 0 ||
        head.y >= tiles ||
        snake.some(part =>
            part.x === head.x &&
            part.y === head.y
        )
    ) {
        dead = true;
        draw();
        gameOver();
        return;
    }

    snake.unshift(head);

    if (
        head.x === food.x &&
        head.y === food.y
    ) {
        score++;
        document.getElementById("score").textContent =
            "Score: " + score;
        makeFood();
    } else {
        snake.pop();
    }

    draw();

    timer = setTimeout(gameLoop, 100);
}

function draw() {
    ctx.fillStyle = "#1f2937";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(
        food.x * size + size / 2,
        food.y * size + size / 2,
        7,
        0,
        Math.PI * 2
    );
    ctx.fill();

    snake.forEach((part, index) => {
        ctx.fillStyle =
            index === 0 ? "#86efac" : "#22c55e";

        ctx.fillRect(
            part.x * size + 1,
            part.y * size + 1,
            size - 2,
            size - 2
        );
    });
}

function gameOver() {
    ctx.fillStyle = "rgba(0,0,0,.65)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "bold 40px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.font = "20px Arial";
    ctx.fillText(
        "Score: " + score,
        canvas.width / 2,
        canvas.height / 2 + 40
    );
}

document.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();

    if (
        ["arrowup","arrowdown","arrowleft","arrowright"].includes(key)
    ) {
        e.preventDefault();
    }

    if ((key === "arrowup" || key === "w") && dy !== 1) {
        nextDx = 0;
        nextDy = -1;
    }

    else if ((key === "arrowdown" || key === "s") && dy !== -1) {
        nextDx = 0;
        nextDy = 1;
    }

    else if ((key === "arrowleft" || key === "a") && dx !== 1) {
        nextDx = -1;
        nextDy = 0;
    }

    else if ((key === "arrowright" || key === "d") && dx !== -1) {
        nextDx = 1;
        nextDy = 0;
    }
});

startGame();
</script>

</body>
</html>
